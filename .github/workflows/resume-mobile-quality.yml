name: Resume mobile quality verification

on:
  push:
    branches: ['improve/mobile-quality-2026-09-11']
    paths: ['.github/workflows/resume-mobile-quality.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-mobile-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    if: github.repository == 'Matsu71/Pet_Game' && github.ref == 'refs/heads/improve/mobile-quality-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resume only if the recovered application has not been integrated
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const g=require('./game.js'),j=require('./journey.js');require('./persistence.js');if(require('./package.json').version!=='0.7.0'||j.STORIES?.length!==8||j.ALBUM?.length!==12||!g.validate(g.fresh()))process.exit(1)"; then
            echo 'Integrated source is present; verifying it without overwriting it.'
          else
            node scripts/integrate-mobile-quality.cjs
          fi
      - name: Install reproducible verification tools
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --save-dev --save-exact playwright@1.55.0 axe-core@4.10.3
          fi
          npx playwright install --with-deps chromium webkit
      - name: Run complete rule and browser verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-artifacts
          npm test | tee quality-artifacts/unit.tap
          npm start > quality-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser | tee quality-artifacts/browser.log
          node scripts/integrate-mobile-quality.cjs --report
          cat docs/QUALITY_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve only verified changes on the improvement branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='improve/mobile-quality-2026-09-11'
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo 'Concurrent changes detected. Tested source is retained as an artifact; no overwrite or force push.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js journey.js persistence.js art.js app.js style.css index.html offline.js sw.js manifest.webmanifest assets/icon-192.png assets/icon-512.png package.json package-lock.json README.md tests docs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'test: verify mobile release and preserve current evidence'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          git rev-parse HEAD > quality-artifacts/verified-commit.txt
      - name: Preserve evidence even if verification fails
        if: always()
        shell: bash
        run: |
          mkdir -p quality-artifacts
          git diff > quality-artifacts/uncommitted.diff
          tar --exclude='./node_modules' --exclude='./.git' --exclude='./quality-artifacts' -czf /tmp/pet-game-reviewed-source.tar.gz .
          cp /tmp/pet-game-reviewed-source.tar.gz quality-artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-quality-resume-${{ github.run_id }}
          path: quality-artifacts/
          retention-days: 30
