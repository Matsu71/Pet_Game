name: Verify and finalize village release
on:
  push:
    branches: ['improve/mobile-quality-2026-09-11']
    paths: ['.github/workflows/finalize-village-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-mobile-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'Matsu71/Pet_Game' && github.ref == 'refs/heads/improve/mobile-quality-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble existing changes and repair unreadable discovery labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-artifacts
          git rev-parse HEAD > quality-artifacts/start-head.txt
          git merge-base --is-ancestor origin/main HEAD
          if [ "$(node -p "require('./package.json').version")" != '0.8.0' ]; then
            node scripts/assemble-village.cjs
          fi
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const G=require('./game.js'),J=require('./journey.js'),V=require('./village.js');
          assert.equal(require('./package.json').version,'0.8.0');
          assert.equal(Object.keys(V.SITES).length,6);assert.equal(Object.keys(V.ACTIVITIES).length,3);
          const css='\n/* Undiscovered artwork is muted; its name remains fully readable. */\n.discovery-icons .locked{opacity:1;filter:none}\n.discovery-icons .locked .pet-art{opacity:.4;filter:grayscale(1)}\n';
          let text=fs.readFileSync('village.css','utf8');
          if(!text.includes('.discovery-icons .locked{opacity:1;filter:none}'))fs.writeFileSync('village.css',text+css);
          let sw=fs.readFileSync('sw.js','utf8');
          assert(sw.includes('village2')||sw.includes('village3'));
          fs.writeFileSync('sw.js',sw.replace('village2','village3'));
          let test=fs.readFileSync('tests/delivery.test.cjs','utf8');
          fs.writeFileSync('tests/delivery.test.cjs',test.replaceAll('village2','village3'));
          const s=G.fresh();assert(G.validate(s)&&J.validate(s)&&V.validate(s));
          NODE
      - name: Pin patched verification dependency and install browsers
        run: |
          npm install --save-dev --save-exact playwright@1.56.0
          npm audit --audit-level=high
          npx playwright install --with-deps chromium webkit
      - name: Verify actual runtime, all rules and both browsers
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js *.cjs scripts/*.cjs; do node --check "$file"; done
          npm test | tee quality-artifacts/unit.tap
          npm start > quality-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/village.js > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser | tee quality-artifacts/browser.log
          node scripts/quality-report.cjs --publish > quality-artifacts/report.log
          cat docs/QUALITY_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit tested normal source to improvement branch only
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='improve/mobile-quality-2026-09-11'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA" || { echo 'Concurrent changes; no overwrite.'; exit 1; }
          rm -f .github/workflows/integrate-mobile-quality.yml .github/workflows/mobile-browser-quality.yml .github/workflows/resume-mobile-quality.yml .github/workflows/village-release.yml .github/workflows/finalize-village-release.yml scripts/integrate-mobile-quality.cjs scripts/diagnose-browser.cjs scripts/assemble-village.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github scripts tests docs app.js index.html server.cjs sw.js style.css package.json package-lock.json README.md village.js village-ui.js village.css
          git diff --cached --check
          git commit -m 'release: integrate tested mobile village and fix discovery label contrast'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > quality-artifacts/verified-commit.txt
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const e=JSON.parse(fs.readFileSync('docs/research/quality-evidence.json','utf8'));
          for(const [file,expected] of Object.entries(e.sourceHashes))assert.equal(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),expected,`Published runtime differs from tested file: ${file}`);
          NODE
      - name: Preserve source and verification tools for reproducible review
        if: always()
        run: |
          mkdir -p quality-artifacts
          git diff > quality-artifacts/uncommitted.diff
          git archive --format=zip HEAD > quality-artifacts/source.zip
          tar --exclude='./node_modules' --exclude='./.git' --exclude='./quality-artifacts' -czf /tmp/forest-village-tested-source.tar.gz .
          cp /tmp/forest-village-tested-source.tar.gz quality-artifacts/
          if [ -d node_modules ]; then tar -czf /tmp/pet-qa-tools.tar.gz node_modules; cp /tmp/pet-qa-tools.tar.gz quality-artifacts/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: village-finalization-${{ github.run_id }}
          path: quality-artifacts/
          retention-days: 30
