name: Verify and finalize village release

on:
  push:
    branches: ['improve/mobile-quality-2026-09-11']
    paths: ['.github/workflows/finalize-village-release.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: integrate-mobile-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'Matsu71/Pet_Game' && github.ref == 'refs/heads/improve/mobile-quality-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRANCH: improve/mobile-quality-2026-09-11
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/mobile-quality-2026-09-11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record inputs and integrate the existing reviewed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-artifacts
          git rev-parse HEAD > quality-artifacts/start-head.txt
          git fetch origin main
          git rev-parse origin/main > quality-artifacts/tested-base.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$(node -p "require('./package.json').version")" != '0.8.0' ]; then
            test -f scripts/assemble-village.cjs
            node scripts/assemble-village.cjs
          fi
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const G=require('./game.js'),J=require('./journey.js'),V=require('./village.js');
          assert.equal(require('./package.json').version,'0.8.0');
          assert.equal(Object.keys(V.SITES).length,6);
          assert.equal(Object.keys(V.ACTIVITIES).length,3);
          assert.equal(J.STORIES.length,8);assert.equal(J.ALBUM.length,12);
          const s=G.fresh();assert(G.validate(s)&&J.validate(s)&&V.validate(s));
          for(const f of ['village-ui.js','village.css','tests/village.test.cjs','scripts/quality-report.cjs'])assert(fs.existsSync(f),f);
          NODE
          # Do not merge unrelated new base changes without first testing their integration.
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'The base branch advanced independently. Rebase/reconcile before publication.'
            exit 1
          }
      - name: Install exact verification tools
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Run every rule, delivery and browser regression
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js *.cjs scripts/*.cjs; do node --check "$file"; done
          npm test | tee quality-artifacts/unit.tap
          npm start > quality-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/village.js > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser | tee quality-artifacts/browser.log
          GITHUB_SHA="$(cat quality-artifacts/start-head.txt)" node scripts/quality-report.cjs --publish > quality-artifacts/report.log
          cat docs/QUALITY_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only tested source and its evidence
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(cat quality-artifacts/start-head.txt)
          REMOTE=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$REMOTE" = "$EXPECTED" || { echo 'Concurrent branch update; no overwrite.'; exit 1; }
          rm -f .github/workflows/integrate-mobile-quality.yml .github/workflows/mobile-browser-quality.yml .github/workflows/resume-mobile-quality.yml .github/workflows/village-release.yml scripts/integrate-mobile-quality.cjs scripts/diagnose-browser.cjs scripts/assemble-village.cjs
          git add -A .github scripts tests docs app.js index.html server.cjs sw.js package.json package-lock.json README.md village.js village-ui.js village.css
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'release: verify village gameplay and retain reproducible browser evidence'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          git rev-parse HEAD > quality-artifacts/verified-commit.txt
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const evidence=JSON.parse(fs.readFileSync('docs/research/quality-evidence.json','utf8'));
          for(const [file,expected] of Object.entries(evidence.sourceHashes)){
            const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            assert.equal(actual,expected,`Publication differs from tested runtime: ${file}`);
          }
          NODE
      - name: Merge the exact verified revision using the existing pull request
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED=$(cat quality-artifacts/verified-commit.txt)
          TESTED_BASE=$(cat quality-artifacts/tested-base.txt)
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TESTED_BASE" || { echo 'Main changed after testing; no merge.'; exit 1; }
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$VERIFIED" || { echo 'Improvement branch changed after testing; no merge.'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/1" > quality-artifacts/pr-before.json
          VERIFIED="$VERIFIED" node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),pr=JSON.parse(fs.readFileSync('quality-artifacts/pr-before.json','utf8'));
          assert.equal(pr.state,'open');assert.equal(pr.draft,false);
          assert.equal(pr.head.repo.full_name,'Matsu71/Pet_Game');assert.equal(pr.base.repo.full_name,'Matsu71/Pet_Game');
          assert.equal(pr.head.ref,'improve/mobile-quality-2026-09-11');assert.equal(pr.base.ref,'main');
          assert.equal(pr.head.sha,process.env.VERIFIED);
          NODE
          # GitHub enforces repository protections; no force/admin bypass is used.
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/1/merge" -f sha="$VERIFIED" -f merge_method=merge -f commit_title='Release verified mobile village gameplay' > quality-artifacts/merge-result.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          assert.equal(JSON.parse(fs.readFileSync('quality-artifacts/merge-result.json','utf8')).merged,true);
          NODE
          git fetch origin main
          git merge-base --is-ancestor "$VERIFIED" origin/main
          git rev-parse origin/main > quality-artifacts/main-commit.txt
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict'),cp=require('node:child_process');
          const e=JSON.parse(fs.readFileSync('docs/research/quality-evidence.json','utf8'));
          for(const [file,expected] of Object.entries(e.sourceHashes))assert.equal(crypto.createHash('sha256').update(cp.execFileSync('git',['show',`origin/main:${file}`])).digest('hex'),expected,`Main runtime mismatch: ${file}`);
          NODE
          echo "Merged verified runtime into main: $(cat quality-artifacts/main-commit.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Request the existing main-branch Pages build when configured
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/pages" > quality-artifacts/pages-config.json; then
            if node -e "const p=require('./quality-artifacts/pages-config.json');process.exit(p.build_type==='legacy' && p.source?.branch==='main' ? 0 : 1)"; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > quality-artifacts/pages-build.json || echo 'Main is updated; existing Pages build request was not accepted.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Existing Pages delivery settings were preserved.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'Main is updated; Pages configuration could not be read.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve source and diagnostics on every outcome
        if: always()
        run: |
          mkdir -p quality-artifacts
          git diff > quality-artifacts/uncommitted.diff
          git archive --format=zip HEAD > quality-artifacts/source.zip
          tar --exclude='./node_modules' --exclude='./.git' --exclude='./quality-artifacts' -czf /tmp/forest-village-tested-source.tar.gz .
          cp /tmp/forest-village-tested-source.tar.gz quality-artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: village-finalization-${{ github.run_id }}
          path: quality-artifacts/
          retention-days: 30
