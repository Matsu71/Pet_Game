<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#344b3d">
  <meta name="description" content="森の小さな村で、お世話と言葉を通じて育てるブラウザゲーム。">
  <title>森の子 — あなたと言葉で育つ、小さな暮らし</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#home" aria-label="森の子 おうちへ"><span class="brand-mark" id="brand-mark"></span><span>森の子<small>FOREST & YOU</small></span></a>
      <div class="header-tools"><span class="save-state" id="save-state">このブラウザに保存</span><button class="icon-button" data-action="settings" aria-label="設定とセーブデータ" id="settings-button"></button></div>
    </header>
    <div class="topline"><div><p class="eyebrow">A LITTLE LIFE, A LITTLE MAGIC.</p><h1>小さな日々が、この子を育てる。</h1><p class="intro-copy">ごはんをあげて、言葉を交わして。今日はどんな一日になるかな。</p></div><div class="village-clock" id="village-clock"></div></div>
    <div class="toolbar"><nav aria-label="ゲームの画面"><button data-view="home" class="nav-button active" aria-current="page">おうち</button><button data-view="village" class="nav-button">村のなかま <span id="nav-count">1</span></button><button data-view="journal" class="nav-button">育ちの記録</button></nav><div class="wallet"><span class="coin-mark">G</span><strong id="coins">30</strong><button class="shop-link" data-action="shop">小さなお店 <span aria-hidden="true">↗</span></button></div></div>
    <main id="main-content"></main>
    <footer><span>森の子 <span class="footer-dot">·</span> はじまりの村</span><span id="mode-footer"></span><button data-action="help">遊び方</button></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <noscript><p class="noscript">このゲームを遊ぶには、ブラウザの JavaScript を有効にしてください。</p></noscript>
</body>
</html>
