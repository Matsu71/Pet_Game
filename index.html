<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#365e45">
  <meta name="description" content="お世話と言葉で個性が育つ、森の小さな暮らし。登録不要で遊べる育成ゲーム。">
  <title>森の子 — あなたと言葉で育つ、小さな暮らし</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
  <script src="journey.js" defer></script>
  <script src="art.js" defer></script>
  <script src="persistence.js" defer></script>
  <script src="app.js" defer></script>
  <script src="offline.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">ゲーム画面へ</a>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#home" aria-label="森の子 おうちへ"><span id="brand-mark"></span><span>森の子<small>FOREST &amp; YOU</small></span></a>
      <div class="header-tools"><span class="save-state" id="save-state">このブラウザに保存</span><button class="icon-button" data-action="settings" aria-label="設定とセーブデータ" id="settings-button"></button></div>
    </header>
    <div class="world-bar"><div class="village-clock" id="village-clock"></div><button class="wallet" data-action="shop" aria-label="小さなお店を開く"><span class="coin-mark">G</span><strong id="coins">30</strong><span class="wallet-label">お店</span></button></div>
    <main id="main-content" tabindex="-1"></main>
    <footer><span id="mode-footer"></span><button data-action="help">遊び方</button></footer>
  </div>
  <nav class="bottom-nav" aria-label="ゲームの画面">
    <button data-view="home" class="nav-button active" aria-current="page"><span data-icon="home"></span><span>おうち</span></button>
    <button data-view="explore" class="nav-button"><span data-icon="compass"></span><span>あそぶ</span></button>
    <button data-view="village" class="nav-button"><span data-icon="leaf"></span><span>なかま <span id="nav-count">1</span></span></button>
    <button data-view="journal" class="nav-button"><span data-icon="book"></span><span>手帖</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <noscript><p class="noscript">このゲームを遊ぶには、ブラウザの JavaScript を有効にしてください。</p></noscript>
</body>
</html>
