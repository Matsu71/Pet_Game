<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>森の子 - Pet Game Prototype</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#f3f5f1;color:#253027}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{padding:10px 14px;border:1px solid #cbd2c8;border-radius:9px;background:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#294332;color:#fff}.app{max-width:1080px;margin:auto;padding:18px}.top,.row,.actions{display:flex;gap:10px;align-items:center}.top{justify-content:space-between}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.card{background:#fff;border:1px solid #dce1da;border-radius:13px;padding:15px;margin-bottom:14px}.stage{height:210px;background:#edf1e9;border-radius:11px;display:grid;place-items:center;position:relative}.pet{width:110px;height:110px;border-radius:48%;background:#d6dfcf;border:3px solid #758373;display:grid;place-items:center;font-size:44px}.badge{position:absolute;top:10px;left:10px;background:#fff;padding:5px 9px;border-radius:99px;font-size:12px}.stats{display:grid;gap:8px;margin-top:14px}.stat{display:grid;grid-template-columns:70px 1fr 42px;gap:8px;align-items:center}.bar{height:9px;background:#e9ece7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#72836f}.actions{flex-wrap:wrap;margin-top:13px}.feedback,.note{padding:9px 11px;border-radius:9px;background:#f5f7f3;font-size:13px;margin-top:9px}.note{background:#fff7df}.talk{display:flex;gap:8px}.talk input{flex:1;padding:10px;border:1px solid #cbd2c8;border-radius:9px}select{font:inherit;padding:9px 10px;border:1px solid #cbd2c8;border-radius:9px;background:#fff}.small{font-size:12px;color:#6d776f}.personal{display:grid;grid-template-columns:1fr 1fr;gap:7px}.personal div{display:flex;justify-content:space-between}.roster{display:grid;gap:7px}.member{display:flex;justify-content:space-between;align-items:center;border:1px solid #e1e5df;border-radius:9px;padding:9px}.member.active{outline:2px solid #81917f}.log{max-height:260px;overflow:auto;font-size:12px}.log div{padding:7px 0;border-bottom:1px solid #ecefea}h1{font-size:21px;margin-bottom:3px}h2{font-size:17px}h3{font-size:15px;margin-bottom:7px;margin-top:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.app{padding:10px}}
</style>
</head>
<body><div class="app">
<div class="top"><div><h1>森の子 <span class="small">Prototype</span></h1><div class="small">1現実日=1歳 / 8歳で自立 / 50歳で寿命 / 最大8体</div></div><strong>所持金 <span id="coins">0</span>G</strong></div>
<div class="grid"><main>
<section class="card"><div class="top"><h2 id="name">---</h2><span id="age" class="small"></span></div>
<div class="stage"><span id="status" class="badge">---</span><div id="pet" class="pet">●</div></div>
<div class="stats">
<div class="stat"><span>空腹</span><div class="bar"><i id="hungerBar"></i></div><b id="hunger">0</b></div>
<div class="stat"><span>清潔</span><div class="bar"><i id="hygieneBar"></i></div><b id="hygiene">0</b></div>
<div class="stat"><span>体力</span><div class="bar"><i id="healthBar"></i></div><b id="health">0</b></div>
<div class="stat"><span>Lv.</span><div class="bar"><i id="xpBar"></i></div><b id="level">1</b></div></div>
<div class="actions"><button id="feed" class="primary">🍚 食事</button><button id="bath">🫧 体を洗う</button><button id="dungeon">⚔️ ダンジョン</button></div>
<div id="feedback" class="feedback">食事・体洗いを押すと変化量が表示されます。</div><div id="care" class="note"></div>
<h3>声をかける</h3><div class="small">LLMは使用せず、文字ベクトル類似度とルールで性格へ反映します。</div>
<div class="talk"><input id="talkInput" maxlength="140" placeholder="例：今日もよく頑張ったね"><button id="talk">話す</button></div><div id="reply" class="feedback">まだあなたのことをよく知りません。</div>
<h3>性格</h3><div id="personality" class="personal"></div>
<h3>能力</h3><div id="abilities" class="personal"></div>
<h3>仕事 <span class="small">8歳から</span></h3>
<div class="row"><select id="jobSelect"></select></div>
<div id="jobInfo" class="feedback">子どもの間は仕事を設定できません。</div>
</section>
<section class="card"><details><summary>開発用：時間操作 / リセット</summary><div class="actions"><button id="plus8h">+8時間</button><button id="plus1d">+1日（+1歳）</button><button id="reset">初期化</button></div></details></section>
</main><aside>
<section class="card"><div class="top"><h2>村 <span id="count" class="small"></span></h2><button id="rescue">森で保護</button></div><div class="small">重点的にお世話するのは選択中の1体。村には最大8体。</div><div id="roster" class="roster" style="margin-top:10px"></div></section>
<section class="card"><h2>記録</h2><div id="log" class="log"></div></section>
</aside></div></div>
<script>
(()=>{"use strict";
const KEY="pet-game-v1",DAY=86400000,HOUR=3600000,ADULT=8,LIFE=50,MAX=8;
const $=id=>document.getElementById(id),clamp=n=>Math.max(0,Math.min(100,n));
const LABEL={kindness:"やさしさ",courage:"勇気",curiosity:"好奇心",discipline:"規律性",sociability:"社交性",emotionalStability:"情緒安定性"};
const NAMES=["ミオ","ルゥ","ノア","ピピ","トワ","ネル","ソラ","ユラ"];
const JOBS={
 none:{name:"仕事なし",place:"-",coins:0,xp:0,intelligence:0,vitality:0,strength:0,traits:{}},
 farming:{name:"農業",place:"森の村",coins:30,xp:8,intelligence:.2,vitality:.35,strength:.45,traits:{discipline:.08}},
 forestry:{name:"林業",place:"森の村",coins:35,xp:12,intelligence:.1,vitality:.45,strength:.75,traits:{courage:.08}},
 construction:{name:"建築",place:"森の村",coins:45,xp:10,intelligence:.5,vitality:.3,strength:.65,traits:{discipline:.10}},
 woodworking:{name:"木工職人",place:"森の村",coins:40,xp:5,intelligence:.8,vitality:.12,strength:.3,traits:{discipline:.10,curiosity:.05}},
 herbalist:{name:"薬草師",place:"森の村",coins:35,xp:2,intelligence:1.0,vitality:.18,strength:.08,traits:{curiosity:.12,kindness:.05}},
 guide:{name:"森の案内人",place:"森の村",coins:35,xp:7,intelligence:.3,vitality:.3,strength:.35,traits:{sociability:.10,curiosity:.12,courage:.08}},
 shop:{name:"店員",place:"近くの町",coins:40,xp:1,intelligence:.4,vitality:.08,strength:.05,traits:{sociability:.16,discipline:.05}},
 clerk:{name:"町役場の記録係",place:"近くの町",coins:45,xp:0,intelligence:.9,vitality:.04,strength:0,traits:{discipline:.12}},
 bookkeeper:{name:"商会の帳簿係",place:"近くの町",coins:50,xp:0,intelligence:1.0,vitality:.04,strength:0,traits:{discipline:.10,sociability:.05}},
 merchant:{name:"商人",place:"近くの町",coins:55,xp:1,intelligence:.6,vitality:.08,strength:.05,traits:{sociability:.16,curiosity:.05}},
 inn:{name:"宿屋の仕事",place:"近くの町",coins:40,xp:2,intelligence:.3,vitality:.12,strength:.12,traits:{sociability:.16,kindness:.10}},
 teacher:{name:"学び舎の先生",place:"近くの町",coins:45,xp:0,intelligence:1.0,vitality:.04,strength:0,traits:{kindness:.10,sociability:.08,discipline:.05}}
};
const anchors=[
 {k:"praise",p:["よく頑張ったね","えらいね","すごいね","できたね"],d:{kindness:1.2,courage:.8,sociability:.5,emotionalStability:.35},r:"うれしい。次もがんばってみる。"},
 {k:"love",p:["大好きだよ","かわいいね","大切だよ","好きだよ"],d:{kindness:1,sociability:1.2,emotionalStability:.6},r:"そばにいると安心する。"},
 {k:"encourage",p:["大丈夫だよ","失敗してもいいよ","挑戦してみよう","怖くないよ"],d:{courage:1.5,kindness:.5,emotionalStability:1.1},r:"少し勇気が出た。"},
 {k:"curious",p:["調べてみよう","見に行こう","面白そうだね","どうしてだと思う"],d:{curiosity:1.6,courage:.3},r:"もっと知りたい。"},
 {k:"discipline",p:["ちゃんとしよう","約束を守ろう","片付けよう","我慢しよう"],d:{discipline:1.5,emotionalStability:.2},r:"わかった。決めたことは守る。"},
 {k:"harsh",p:["嫌い","ばか","弱い","だめ","うるさい"],d:{kindness:-1.2,courage:-1,sociability:-.8,emotionalStability:-1.3},r:"……少し怖い。"}
];
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function make(name){let base={kindness:50,courage:50,curiosity:50,discipline:50,sociability:50,emotionalStability:50};return{id:id(),name,bornAt:Date.now(),offset:0,lastAt:Date.now(),hunger:82,hygiene:86,health:100,neglectHours:0,sick:false,dead:false,deathReason:"",level:1,xp:0,intelligence:50,vitality:50,strength:50,job:"none",lastWorkAge:null,lastDungeonDay:null,personalityBase:{...base},personality:{...base},memory:{talkCount:0,careCount:0,dungeonCount:0}}}
function fresh(){let c=make("ミオ");return{coins:0,active:c.id,creatures:[c],logs:[{t:Date.now(),s:"森のはずれで小さな子を保護しました。"}]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{S=fresh()}
function migrate(){for(const c of S.creatures||[]){c.personality=c.personality||{};if(!Number.isFinite(c.vitality))c.vitality=Number.isFinite(c.personality.vitality)?c.personality.vitality:50;delete c.personality.vitality;if(!Number.isFinite(c.strength))c.strength=50;if(!Number.isFinite(c.intelligence))c.intelligence=50;c.personalityBase=c.personalityBase||{};for(const k of Object.keys(LABEL)){if(!Number.isFinite(c.personality[k]))c.personality[k]=50;if(!Number.isFinite(c.personalityBase[k]))c.personalityBase[k]=c.personality[k]}if(!JOBS[c.job])c.job="none";if(!("lastWorkAge" in c))c.lastWorkAge=null;c.memory=c.memory||{talkCount:0,careCount:0,dungeonCount:0}}}
migrate();
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function now(c){return Date.now()+(c.offset||0)}function age(c){return Math.floor((now(c)-c.bornAt)/DAY)}function adult(c){return age(c)>=ADULT}function current(){return S.creatures.find(c=>c.id===S.active)||S.creatures[0]}
function dayKey(ms){let d=new Date(ms);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function log(s){S.logs.unshift({t:Date.now(),s});S.logs=S.logs.slice(0,80)}
function adjustPersonality(c,k,delta){let base=Number.isFinite(c.personalityBase?.[k])?c.personalityBase[k]:50;let next=(c.personality[k]??base)+delta;c.personality[k]=Math.max(0,Math.min(100,Math.max(base-20,Math.min(base+20,next))))}
function sim(c){if(c.dead)return;let a=age(c);if(a>=LIFE){c.dead=true;c.health=0;c.deathReason="50歳で寿命を迎えました。";log(`${c.name}は50歳で寿命を迎えました。`);return}let n=now(c),h=Math.max(0,(n-(c.lastAt||n))/HOUR);if(h<.01)return;c.hunger=clamp(c.hunger-h*(adult(c)?.35:1.6));c.hygiene=clamp(c.hygiene-h*(adult(c)?.22:1.05));if(!adult(c)){let bad=c.hunger<22||c.hygiene<22;c.neglectHours=Math.max(0,c.neglectHours+(bad?h:-h*1.3));if(!c.sick&&c.neglectHours>=6){c.sick=true;log(`${c.name}はお世話不足で病気になりました。`)}if(c.sick){c.health=clamp(c.health-h*(.5+(c.hunger<10?.35:0)+(c.hygiene<10?.35:0)));if(c.health<=0){c.dead=true;c.deathReason="幼少期のお世話不足で体力が尽きました。";log(`${c.name}は体力が尽きました。`)}}}else{c.neglectHours=0;if(c.sick){c.health=clamp(c.health+h*.3);if(c.health>=70)c.sick=false}}c.lastAt=n}
function gainXp(c,amount){c.xp+=amount;while(c.xp>=c.level*40){c.xp-=c.level*40;c.level++;log(`${c.name}はLv.${c.level}になりました。`)}}
function applyWork(c,workAge){let j=JOBS[c.job||"none"];if(!j||c.job==="none"||c.dead||workAge<ADULT)return;S.coins+=j.coins;gainXp(c,j.xp);c.intelligence=clamp(c.intelligence+j.intelligence);c.vitality=clamp(c.vitality+j.vitality);c.strength=clamp(c.strength+j.strength);for(const [k,v] of Object.entries(j.traits||{}))adjustPersonality(c,k,v);c.lastWorkAge=workAge;log(`${c.name}は${j.place}で「${j.name}」の仕事をし、${j.coins}Gを得ました。`)}
function processWork(c){if(!adult(c)||c.dead||!JOBS[c.job]||c.job==="none")return;let a=age(c),last=Number.isFinite(c.lastWorkAge)?c.lastWorkAge:a-1;for(let workAge=Math.max(ADULT,last+1);workAge<=a;workAge++)applyWork(c,workAge)}
function simulate(){S.creatures.forEach(c=>{sim(c);processWork(c)});save()}
function recover(c){if(c.sick&&c.hunger>55&&c.hygiene>55&&c.health>=45){c.neglectHours=Math.max(0,c.neglectHours-4);if(c.neglectHours<=1){c.sick=false;c.vitality=clamp(c.vitality+.8);log(`${c.name}は元気を取り戻しました。`)}}}
function feed(){let c=current();if(!c||c.dead)return;let a=c.hunger,b=c.health;c.hunger=clamp(c.hunger+42);c.health=clamp(c.health+(c.sick?3:1));c.memory.careCount++;recover(c);log(`${c.name}に食事をあげました。`);$("feedback").textContent=`食事：空腹 ${Math.round(a)} → ${Math.round(c.hunger)} / 体力 ${Math.round(b)} → ${Math.round(c.health)}`;save();render()}
function bath(){let c=current();if(!c||c.dead)return;let a=c.hygiene,b=c.health;c.hygiene=clamp(c.hygiene+48);c.health=clamp(c.health+(c.sick?2:0));c.memory.careCount++;recover(c);log(`${c.name}の体を洗いました。`);$("feedback").textContent=`体を洗う：清潔 ${Math.round(a)} → ${Math.round(c.hygiene)} / 体力 ${Math.round(b)} → ${Math.round(c.health)}`;save();render()}
function dungeon(){let c=current(),today=dayKey(now(c));if(!c||c.dead||c.lastDungeonDay===today)return;let r=Math.random(),coins=r<.2?100:r<.55?60:35,xp=r<.2?35:r<.55?30:20;c.lastDungeonDay=today;c.memory.dungeonCount++;S.coins+=coins;c.intelligence=clamp(c.intelligence+(r<.2?.45:.15));c.vitality=clamp(c.vitality+.25);c.strength=clamp(c.strength+(r<.55?.55:.35));gainXp(c,xp);adjustPersonality(c,"courage",(r<.55?.45:.15));adjustPersonality(c,"curiosity",(r<.2?.35:.12));adjustPersonality(c,"emotionalStability",.10);log(`${c.name}はダンジョンから${coins}Gと${xp}XPを持ち帰りました。`);save();render()}
function vec(t){t=(t||"").toLowerCase().replace(/[！!？?。、,.「」『』（）()\s]/g,"");let v={};for(let i=0;i<t.length;i++){let u=t[i];v[u]=(v[u]||0)+.3;if(i<t.length-1){let b=t.slice(i,i+2);v[b]=(v[b]||0)+1}}return v}function cos(a,b){let dot=0,aa=0,bb=0;for(let k in a){aa+=a[k]*a[k];if(b[k])dot+=a[k]*b[k]}for(let k in b)bb+=b[k]*b[k];return aa&&bb?dot/Math.sqrt(aa*bb):0}
const AV=anchors.map(a=>({...a,v:a.p.map(vec)}));function talk(){let c=current(),text=$("talkInput").value.trim();if(!c||c.dead||!text)return;let tv=vec(text),best=null;for(let a of AV){let score=Math.max(...a.v.map(x=>cos(tv,x)));if(a.k==="harsh"&&/(嫌い|ばか|弱い|だめ|うるさい)/.test(text))score+=.35;if(!best||score>best.score)best={a,score}}c.memory.talkCount++;if(best&&best.score>=.18){let m=Math.max(.45,Math.min(1.6,best.score*2.1));for(let k in best.a.d)adjustPersonality(c,k,best.a.d[k]*m*.35);$("reply").textContent=best.a.r;log(`${c.name}への声かけを ${best.a.k} として反映しました。`)}else{adjustPersonality(c,"sociability",.05);$("reply").textContent=age(c)<3?"……？":"うん。聞いてるよ。"}$("talkInput").value="";save();render()}
function rescue(){if(S.creatures.length>=MAX)return;let used=new Set(S.creatures.map(c=>c.name)),n=NAMES.find(x=>!used.has(x))||`子${S.creatures.length+1}`,c=make(n);S.creatures.push(c);S.active=c.id;log(`森で${n}を保護しました。`);save();render()}
function setJob(){let c=current();if(!c||c.dead||!adult(c))return;c.job=$("jobSelect").value;if(!Number.isFinite(c.lastWorkAge))c.lastWorkAge=age(c)-1;log(`${c.name}の仕事を「${JOBS[c.job].name}」に設定しました。`);save();render()}
function status(c){return c.dead?"死亡":c.sick?"病気":adult(c)?"大人・自立":"子ども・要お世話"}function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function render(){simulate();let c=current();if(!c)return;$("coins").textContent=S.coins;$("name").textContent=c.name;$("age").textContent=`${age(c)}歳 / Lv.${c.level}`;$("status").textContent=status(c);$("pet").textContent=c.dead?"×":c.sick?"…":adult(c)?"◆":"●";for(let [k,idv,idb] of [["hunger","hunger","hungerBar"],["hygiene","hygiene","hygieneBar"],["health","health","healthBar"]]){$(idv).textContent=Math.round(c[k]);$(idb).style.width=`${c[k]}%`}let need=c.level*40;$("level").textContent=c.level;$("xpBar").style.width=`${(c.xp/need)*100}%`;$("feed").disabled=$("bath").disabled=$("talk").disabled=$("talkInput").disabled=c.dead;let done=c.lastDungeonDay===dayKey(now(c));$("dungeon").disabled=c.dead||done;$("care").textContent=c.dead?c.deathReason:c.sick?"病気です。食事と清潔を回復させてください。":adult(c)?`現在${age(c)}歳。大人は放置でも生存し、50歳で寿命を迎えます。`:`現在${age(c)}歳。7歳までは空腹・不潔の放置で病気になります。`;$("personality").innerHTML=Object.entries(LABEL).map(([k,l])=>`<div><span>${l}</span><b>${Math.round(c.personality[k])}</b></div>`).join("");$("abilities").innerHTML=`<div><span>賢さ</span><b>${Math.round(c.intelligence)}</b></div><div><span>生命力</span><b>${Math.round(c.vitality)}</b></div><div><span>力</span><b>${Math.round(c.strength)}</b></div><div><span>戦闘力</span><b>Lv.${c.level}</b></div>`;let options=Object.entries(JOBS).map(([k,j])=>`<option value="${k}" ${c.job===k?"selected":""}>${j.place==="-"?"":j.place+" / "}${j.name}</option>`).join("");$("jobSelect").innerHTML=options;$("jobSelect").disabled=c.dead||!adult(c);let j=JOBS[c.job||"none"];$("jobInfo").textContent=!adult(c)?"8歳になると仕事を設定できます。":c.job==="none"?"仕事を設定すると、現実1日ごとに自動で働きます。":`${j.place}：${j.name} / 1日 ${j.coins}G / XP +${j.xp} / 賢さ +${j.intelligence} / 生命力 +${j.vitality} / 力 +${j.strength}`;$("count").textContent=`${S.creatures.length}/${MAX}`;$("rescue").disabled=S.creatures.length>=MAX;$("roster").innerHTML=S.creatures.map(x=>`<div class="member ${x.id===c.id?"active":""}"><span><b>${esc(x.name)}</b><br><span class="small">${age(x)}歳 / Lv.${x.level} / ${status(x)}</span></span><button data-pet="${x.id}" ${x.id===c.id?"disabled":""}>選択</button></div>`).join("");document.querySelectorAll("[data-pet]").forEach(b=>b.onclick=()=>{S.active=b.dataset.pet;save();render()});$("log").innerHTML=S.logs.map(x=>`<div>${esc(x.s)}<br><span class="small">${new Date(x.t).toLocaleString()}</span></div>`).join("")}
$("feed").onclick=feed;$("bath").onclick=bath;$("dungeon").onclick=dungeon;$("jobSelect").onchange=setJob;$("talk").onclick=talk;$("talkInput").onkeydown=e=>{if(e.key==="Enter")talk()};$("rescue").onclick=rescue;$("plus8h").onclick=()=>{let c=current();c.offset+=8*HOUR;sim(c);log(`【開発】${c.name}を8時間進めました。`);save();render()};$("plus1d").onclick=()=>{let c=current();c.offset+=DAY;sim(c);log(`【開発】${c.name}を1日進めました。`);save();render()};$("reset").onclick=()=>{if(confirm("セーブデータを初期化しますか？")){localStorage.removeItem(KEY);S=fresh();save();render()}};render();setInterval(render,60000);
})();
</script></body></html>
